<body>
<div class="wrap">
  <div class="topline"><div class="brand"><span class="brand-block">SO</span><span>SQUARE <strong>OFF</strong></span></div><div class="version"><span class="signal"></span> DESKTOP EDITION <b> / BUILD 4.5</b></div></div>

<script>
(()=>{
'use strict';
const W=1120,H=630,GRAV=1930,GROUND=564,TAU=Math.PI*2;
// A level shot fired from the ground reaches roughly 3/8 of the arena width
// before hitting the floor. Character gravity stays independent.
const BULLET_GRAVITY=2430;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:true});
let renderScaleX=1,renderScaleY=1;
function resizeGameCanvas(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const cssW=Math.max(1,Math.round(canvas.clientWidth||window.innerWidth));
 const cssH=Math.max(1,Math.round(canvas.clientHeight||window.innerHeight));
 canvas.width=Math.round(cssW*dpr);
 canvas.height=Math.round(cssH*dpr);
 renderScaleX=canvas.width/W;
 renderScaleY=canvas.height/H;
 ctx.imageSmoothingEnabled=true;
}
resizeGameCanvas();
window.addEventListener('resize',resizeGameCanvas);
const $=id=>document.getElementById(id), overlay=$('overlay'),panel=$('panel'),hud=$('hud'),hint=$('bottomHint'),toasts=$('toasts'),touchEl=$('touch');
const keys=new Set(), touch={left:false,right:false,jump:false,shoot:false,block:false};
let practiceMode=false,practiceRespawn=0,practicePanelOpen=true;

function createArena(name,seed,width,height,halfObjects,centerObjects=[]){

 const platforms=[];
 for(const [offset,y,w,h] of halfObjects){
  // offset measures the left face of a rectangle, relative to map center
  const a={x:mid+offset,y,w,h};platforms.push(a,{x:2*mid-a.x-a.w,y,w,h});
 }
 for(const [y,w,h] of centerObjects)platforms.push({x:mid-w/2,y,w,h});
 return {name,seed,width,height,bounds:{left,right,top,bottom},platforms,
 spawn:[mid-width*.33,mid+width*.33],spawnY:bottom-126};
}

// Central, mirrored cover stacks: 8–12 per arena. Each pair stands on a
// shared-height mirrored platform, toward the fight rather than at the edges.
// Never obstruct the verified starting positions or maximum-size passages.
function makeCrateStacks(map){
 const mid=(map.bounds.left+map.bounds.right)/2, crates=[];
 const left=map.platforms.filter(pl=>pl.x+pl.w/2<mid&&pl.w>=105);
 // Select two useful distinct elevations, prioritizing platforms nearer mid.
 const ranked=left.map(pl=>({pl,score:Math.abs(mid-(pl.x+pl.w*.64))+.28*Math.abs(pl.y-(map.bounds.bottom-275))})).sort((a,b)=>a.score-b.score);
 const supports=[];
 for(const {pl} of ranked){
  if(supports.length>=2)break;
  if(supports.some(s=>Math.abs(s.y-pl.y)<75))continue;
  supports.push(pl);
 }
 const levels=map.seed%3===0?[3,3]:[3,2];
 supports.forEach((pl,index)=>{
  const size=30, count=levels[index];
  // Bias each stack toward the arena center, yet leave a 65+ unit walking lane.
  const desired=pl.x+pl.w*.70-size/2;
  const leftX=cap(desired,pl.x+12,pl.x+pl.w-size-12);
  const rightX=2*mid-leftX-size;
  for(let layer=0;layer<count;layer++){
   for(const x of [leftX,rightX])crates.push({x,y:pl.y-size*(layer+1),w:size,h:size,vx:0,vy:0,grounded:true});
  }
 });
 return crates;
}

// Crates on top of another crate are carried by its horizontal motion.
// The support check is geometric, so losing overlap immediately restores gravity.
function crateRiders(base, seen=new Set()){
 const riders=[];

  if(seen.has(other))continue;
  const foot=other.y+other.h;
  const overlap=Math.min(base.x+base.w,other.x+other.w)-Math.max(base.x,other.x);
  if(Math.abs(foot-base.y)<=2.25&&overlap>Math.min(base.w,other.w)*.22){

  if(arena.platforms.some(pl=>overlapsRect(test,pl)))return false;
  return !moveableBlocks.some(pl=>!included.has(pl)&&overlapsRect(test,pl));
 });

  for(const r of riders)r.vx=0;

function updateCrates(dt){
 // Bottom-first resolution supports natural stacks without teleporting boxes.
 for(const box of [...moveableBlocks].sort((a,b)=>b.y-a.y)){
  const xstep=box.vx*dt;
  if(!slideCrateStack(box,xstep))box.vx=0;
  box.vx*=Math.max(0,1-5*dt);
  if(Math.abs(box.vx)<2)box.vx=0;
  box.vy=Math.min(850,box.vy+GRAV*dt);
  const step=box.vy*dt;
  if(canCrateTranslate(box,0,step)){box.y+=step;box.grounded=false}
  else if(step>=0){
   const foot=box.y+box.h;
   const lands=solidCrateTerrain().filter(p=>p!==box&&box.x+box.w>p.x+2&&box.x<p.x+p.w-2&&p.y>=foot-1&&p.y<=foot+step+1);
   if(lands.length)box.y=Math.min(...lands.map(p=>p.y))-box.h;
   box.vy=0;box.grounded=true;
  }else box.vy=0;

// Arena-design constraint: at 120% size the combat hitbox is 57.6 x 72.
// All intended inter-platform corridors are at least 68 wide or 82 tall.
const MAX_FIGHTER_W=48*1.2,MAX_FIGHTER_H=60*1.2;
function verifyArenaClearance(map){
 const ps=map.platforms;
 for(let i=0;i<ps.length;i++)for(let j=0;j<i;j++){
  const a=ps[i],b=ps[j];
  const xGap=Math.max(0,b.x-(a.x+a.w),a.x-(b.x+b.w));
  const yGap=Math.max(0,b.y-(a.y+a.h),a.y-(b.y+b.h));
  // Detect undersized open corridors (leave a small movement buffer).
  if(xGap===0&&yGap>0&&yGap<MAX_FIGHTER_H+8)return false;
  if(yGap===0&&xGap>0&&xGap<MAX_FIGHTER_W+8)return false;
 }

}

function arenaSpawn(p){
 // Spawn on a clear, genuinely supported ledge. Large block maps have raised
 // massive solids above their floors; never place a fighter inside those blocks.
 const mid=(arena.bounds.left+arena.bounds.right)/2;
 const desiredX=mid+(p.id===0?-1:1)*arena.width*.33;
 const groundLimit=arena.bounds.bottom-285;
 const candidates=arena.platforms.filter(pl=>
  pl.y>=groundLimit&&pl.y<=arena.bounds.bottom-15&&pl.w>=p.w+20&&
  desiredX>=pl.x+p.w*.6&&desiredX<=pl.x+pl.w-p.w*.6);
 const safe=candidates.map(pl=>{
  const x=cap(desiredX-p.w/2,pl.x+9,pl.x+pl.w-p.w-9),y=pl.y-p.h;
  if(y<arena.bounds.top+24)return null;

   x+p.w>other.x+2&&x<other.x+other.w-2&&y+p.h>other.y+2&&y<other.y+other.h-2);
  return occupied?null:{pl,x,y};
 }).filter(Boolean).sort((a,b)=>a.pl.y-b.pl.y);

 if(spawn){p.x=spawn.x;p.y=spawn.y;p.grounded=true;}
 else{
  // Fallback: search any suitable platform before ever spawning in solid rock.
  const fallback=arena.platforms.filter(q=>q.w>=p.w+20&&q.y>arena.bounds.top+p.h+25)
   .sort((a,b)=>Math.abs(a.x+a.w/2-desiredX)-Math.abs(b.x+b.w/2-desiredX))[0];
  p.x=fallback?cap(desiredX-p.w/2,fallback.x+10,fallback.x+fallback.w-p.w-10):desiredX-p.w/2;
  p.y=fallback?fallback.y-p.h:arena.spawnY-p.h;p.grounded=!!fallback;
 }

}

function darkenHex(hex,amt=.18){
 if(typeof hex!=='string'||hex[0]!=='#')return hex;
 let h=hex.slice(1);
 if(h.length===3)h=h.split('').map(c=>c+c).join('');
 const n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;

}

  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);

 };

function guestPrepareRound(m){
 if(!Number.isInteger(m.epoch)||m.epoch<netGuestRoundEpoch||!m.payload)return;

 if(m.epoch>netGuestRoundEpoch){
  netGuestRoundEpoch=m.epoch;
  updateGuestSnapshot(m.payload);
  guestSmooth=null;remoteKeys={};mouse.down=false;keys.clear();

// Unified damage feedback: one distinctive crunchy synth hit for either fighter.
function damageHitSound(){
 if(muted)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  const now=audio.currentTime,master=audio.createGain();master.gain.value=.23;master.connect(audio.destination);
  const osc=audio.createOscillator(),g=audio.createGain();osc.type='square';
  osc.frequency.setValueAtTime(390,now);osc.frequency.exponentialRampToValueAtTime(95,now+.095);
  g.gain.setValueAtTime(.65,now);g.gain.exponentialRampToValueAtTime(.001,now+.105);
  osc.connect(g);g.connect(master);osc.start(now);osc.stop(now+.11);
  const snap=audio.createOscillator(),sg=audio.createGain();snap.type='triangle';
  snap.frequency.setValueAtTime(1500,now);snap.frequency.exponentialRampToValueAtTime(500,now+.055);
  sg.gain.setValueAtTime(.42,now);sg.gain.exponentialRampToValueAtTime(.001,now+.062);
  snap.connect(sg);sg.connect(master);snap.start(now);snap.stop(now+.07);
  setTimeout(()=>{try{master.disconnect()}catch(e){}},200);
 }catch(e){}
}
// Show Vampire Fizz healing in teal on the health bar, not floating numbers.
function showVampireHeal(fighter,oldHp){
 if(!fighter||fighter.hp<=oldHp)return;
 const previous=fighter.healTrailHold>0?Math.min(oldHp,fighter.healTrailFrom??oldHp):oldHp;
 fighter.healTrailFrom=previous;
 fighter.healTrailHold=.48;
}
function dealDamage(target,amount,attacker=null){
 if(!target||target.dead||amount<=0)return 0;
 const before=Math.max(0,target.hp);
 const sourceIsShot=attacker&&attacker!==target;
 if(sourceIsShot&&target.stats.ironhide)amount*=1-Math.min(.6,.15*target.stats.ironhide);
 if(sourceIsShot)target.lastHurt=clock;
 const fatal=amount>=before&&sourceIsShot&&target.secondWindReady;
 if(fatal){target.secondWindReady=false;target.hp=Math.max(15,target.hp);amount=Math.max(0,target.hp-15);burst(target.x+target.w/2,target.y+target.h/2,'#ffb0e1',22,150);poptext(target.x+target.w/2,target.y-32,'SECOND WIND!','#ffefff');}
 const dealt=Math.min(before,amount);
 if(dealt<=0)return 0;
 target.healthTrail=Math.max(target.healthTrail??before,before);
 target.healthTrailHold=.44;
 target.hp=Math.max(0,before-dealt);
 target.hitflash=Math.max(target.hitflash||0,.12);target.lastHurt=clock;
 damageHitSound();
 // Vampire Fizz leeches actual enemy HP lost from all attacks, including
 // poison ticks and block-effect damage. Never heal from self damage.
 if(attacker&&attacker!==target&&!attacker.dead&&attacker.stats.vamp>0){
  const healed=Math.min(attacker.stats.maxHp-attacker.hp,dealt*attacker.stats.vamp);
  if(healed>0){const oldHp=attacker.hp;attacker.hp+=healed;showVampireHeal(attacker,oldHp);}
 }
 return dealt;
}

   ctx.strokeStyle='#ffb8c0';ctx.lineWidth=1.25;
   const x=b.laserPoint.x,y=b.laserPoint.y;
   ctx.beginPath();ctx.arc(x,y,7+Math.sin(clock*20)*1.2,0,TAU);ctx.stroke();
  }
  ctx.restore();
 }
if(b.locklime){
  const v=Math.hypot(b.vx,b.vy)||1,ux=b.vx/v,uy=b.vy/v;
  ctx.save();ctx.globalAlpha=.65+.2*Math.sin(clock*47+b.x*.05);
  ctx.strokeStyle=b.laserLocked?'#ffb14c':'#f9d279';ctx.lineWidth=3.5;
  ctx.beginPath();ctx.moveTo(b.x-ux*b.r*1.2,b.y-uy*b.r*1.2);
  ctx.lineTo(b.x-ux*(b.r+13+4*Math.sin(clock*64+b.y)),b.y-uy*(b.r+13+4*Math.sin(clock*64+b.y)));
  ctx.stroke();ctx.restore();
 }
ctx.strokeStyle=b.col;ctx.globalAlpha=.3;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x-b.vx*.018,b.y-b.vy*.018);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill()}}
function drawParticles(){for(const p of particles){const a=cap(p.life/(p.max||.5),0,1);ctx.globalAlpha=a;ctx.fillStyle=p.col;if(p.shape==='square'){const size=p.r*Math.max(.35,a);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillRect(-size/2,-size/2,size,size);ctx.restore();}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(.1,a),0,TAU);ctx.fill()}}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=cap(t.life,0,1);ctx.font='900 19px Impact, Arial Black, sans-serif';ctx.textAlign='center';ctx.strokeStyle='#111a2d';ctx.lineWidth=5;ctx.strokeText(t.msg,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.msg,t.x,t.y)}ctx.globalAlpha=1}
function render(){
 let orig1=null,orig2=null;
 if(netRole==='guest'&&guestSmooth&&p1&&p2&&state==='playing'){
  orig1=[p1.x,p1.y];orig2=[p2.x,p2.y];
  const amt=.27;
  guestSmooth.x1+=(p1.x-guestSmooth.x1)*amt;guestSmooth.y1+=(p1.y-guestSmooth.y1)*amt;
  guestSmooth.x2+=(p2.x-guestSmooth.x2)*amt;guestSmooth.y2+=(p2.y-guestSmooth.y2)*amt;
  p1.x=guestSmooth.x1;p1.y=guestSmooth.y1;p2.x=guestSmooth.x2;p2.y=guestSmooth.y2;
 }
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(renderScaleX,0,0,renderScaleY,0,0);ctx.save();ctx.translate(cameraX,cameraY);ctx.scale(cameraScale,cameraScale);if(shakeEnabled&&shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBackground();drawBullets();drawEffectWaves();drawBlockEffects();drawPlayer(p1);drawPlayer(p2);drawFrostbiteArmor(p1);drawFrostbiteArmor(p2);drawParticles();ctx.restore();
 if(orig1){p1.x=orig1[0];p1.y=orig1[1];p2.x=orig2[0];p2.y=orig2[1];}
 if(state==='playing'&&mouse.used&&p1){ctx.save();ctx.translate(cameraX,cameraY);ctx.scale(cameraScale,cameraScale);ctx.strokeStyle='#ffd44aaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,TAU);ctx.moveTo(mouse.x-15,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+15,mouse.y);ctx.moveTo(mouse.x,mouse.y-15);ctx.lineTo(mouse.x,mouse.y-5);ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+15);ctx.stroke();ctx.restore()}
 if(state==='roundover'&&winner!==null){ctx.fillStyle='#07101abb';ctx.fillRect(0,190,W,142);ctx.font='900 65px Impact, Arial Black, sans-serif';ctx.fillStyle=winner===0?'#ff595b':'#4594ff';ctx.textAlign='center';ctx.fillText((winner===0?'RED':(netRole?'BLUE':'BLUE BOT'))+' WINS ROUND!',W/2,275);ctx.fillStyle='#d1def0';ctx.font='800 17px monospace';ctx.fillText('UPGRADE DRAFT INCOMING',W/2,306)}
}
$('practiceToggle').onclick=()=>openPracticePanel(!practicePanelOpen);$('practiceReset').onclick=resetPracticeBuild;$('practiceRespawnBtn').onclick=respawnDummy;$('practiceFrostTest').onclick=()=>{if(!practiceMode)return;if(p2.dead||p2.hiddenBody)respawnDummy();applyFrostbite(p2,1);openPracticePanel(false);toast('FROST TEST — ICE VISIBLE FOR 2 SECONDS');};$('practiceExit').onclick=menu;
function frame(now){
 let dt=cap((now-last)/1000,0,.032);last=now;
 if(netRole==='host'&&state==='online_sync_wait'&&now-netWaitResend>1400){
  netWaitResend=now;sendRoundPrepare(); // Retry until guest confirms, no host head start.
 }
 updateOnlineCountdown(now);
 tick(dt);render();requestAnimationFrame(frame);
}
function canvasMouse(e){let r=canvas.getBoundingClientRect();const pt=worldPoint((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);mouse.x=pt.x;mouse.y=pt.y;mouse.used=true}
canvas.addEventListener('mousemove',canvasMouse);canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){canvasMouse(e);if(e.button===0)mouse.down=true;else if(e.button===2&&inPlay())block(p1)}else if(inPlay()){canvasMouse(e);mouse.down=true}});window.addEventListener('pointerup',()=>mouse.down=false);canvas.addEventListener('contextmenu',e=>e.preventDefault());
// Text fields take priority over game controls, including room code and server URL.
function typingInField(target){
 const el=target instanceof Element?target:null;
 return !!(el&&(el.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"]),[role="textbox"]')||el.isContentEditable));
}
document.addEventListener('focusin',e=>{if(typingInField(e.target))keys.clear()});
window.addEventListener('keydown',e=>{
 if(typingInField(e.target)||typingInField(document.activeElement))return;
 if(['Space','KeyW','KeyA','KeyS','KeyD','KeyE','KeyF','ShiftLeft','ShiftRight','Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code))e.preventDefault();
 keys.add(e.code);
 if(state==='draft'&&['Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)){pickCard(window.currentOptions,Number(e.code.slice(-1))-1)}
 if(e.code==='Escape'){e.preventDefault();if(state==='playing'&&netRole!=='guest')pause();else if(state==='paused')resume();else if(state==='settings'||state==='help'||state==='gameover')menu()}
});
window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();mouse.down=false;Object.keys(touch).forEach(k=>touch[k]=false);if(state==='playing'&&netRole!=='guest')pause()});
function pause(){if(netRole)return;state='paused';setMusicTheme('menu');showOverlay(`<div class="result-panel"><div class="eyebrow"><span class="nib"></span> TIMEOUT / GAME PAUSED</div><div class="result-kicker">TAKE FIVE.</div><h2 class="roundheading">BACK <span>AT IT?</span></h2><p class="subtitle">Your fight is right where you left it. Press Escape to resume.</p><div class="buttonrow"><button class="btn" id="resumeBtn">RESUME FIGHT</button><button class="btn secondary" id="exitBtn">MAIN MENU</button></div></div>`);$('resumeBtn').onclick=resume;$('exitBtn').onclick=menu}
function resume(){state='playing';setMusicTheme('battle');hideOverlay()}
for(const btn of document.querySelectorAll('[data-touch]')){const kind=btn.dataset.touch;const set=(v)=>{touch[kind]=v;btn.classList.toggle('pressed',v)};btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);set(true)});btn.addEventListener('pointerup',e=>{e.preventDefault();set(false)});btn.addEventListener('pointercancel',()=>set(false));btn.addEventListener('lostpointercapture',()=>set(false))}
$('soundBtn').onclick=()=>{muted=!muted;syncSound();savePrefs();if(!muted)sound(610,.08);refreshMusic()};syncSound();$('menuBtn').onclick=()=>{if(state==='playing'&&netRole!=='guest')pause();else menu()};
menu();const invitedCode=new URLSearchParams(location.search).get('room');if(invitedCode&&/^[A-Za-z0-9]{6}$/.test(invitedCode)){onlineMenu();$('joinCode').value=invitedCode.toUpperCase()}requestAnimationFrame(frame);
})();
</script>
