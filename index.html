 if(arena){for(const p of arena.platforms){ctx.fillStyle='#101929';roundRect(p.x+5,p.y+6,p.w,p.h+8,5);ctx.fill();const gr=ctx.createLinearGradient(0,p.y,0,p.y+21);gr.addColorStop(0,'#4f688a');gr.addColorStop(1,'#293b56');ctx.fillStyle=gr;roundRect(p.x,p.y,p.w,p.h,4);ctx.fill();ctx.fillStyle='#ffce42';ctx.globalAlpha=.7;ctx.fillRect(p.x+7,p.y+1,p.w-14,3);ctx.globalAlpha=1;for(let x=p.x+17;x<p.x+p.w-9;x+=26){ctx.fillStyle='#0c172a66';ctx.fillRect(x,p.y+8,12,3)}}}
}
function drawPlayer(p){
 if(!p)return;
 const x=p.x,y=p.y,w=p.w,h=p.h,t=clock,skin=p.color,outline='#101728';
 const facing=Math.cos(p.aim)>=0?1:-1, stride=cap(Math.abs(p.vx)/p.stats.speed,0,1)*Math.sin(t*18)*6;
 ctx.save();
 if(p.invuln>0&&Math.floor(t*15)%2===0)ctx.globalAlpha=.75;
 // Contact shadow stays on the surface below the square fighter.
 ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(x+w/2,Math.min(GROUND-2,y+h+3),26,5,0,0,TAU);ctx.fill();
 // Local coordinates make it straightforward to animate the square's face and limbs.
 ctx.translate(x+w/2,y+h*.46);
 if(p.dead)ctx.rotate(facing*.35);
 else if(p.faceHit>0)ctx.rotate(Math.sin(t*44)*.045);
 else ctx.rotate(Math.sin(t*9)*.015*stride/6);
 ctx.translate(-w/2,-h*.46);
 ctx.lineCap='round';ctx.lineJoin='round';
 const limb=(x1,y1,x2,y2,width=7)=>{
   ctx.strokeStyle=outline;ctx.lineWidth=width+2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.strokeStyle=skin;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 };
 const hand=(px,py)=>{
   ctx.fillStyle=skin;ctx.strokeStyle=outline;ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(px,py,4.4,0,TAU);ctx.fill();ctx.stroke();
 };
 // Matching color everywhere: red body, red arms, red fists, and red feet.
 const step=p.dead?0:stride;
 limb(16,43,15+step,56,7);limb(33,43,33-step,56,7);
 limb(12+step,57,18+step,57,6);limb(30-step,57,36-step,57,6);
 const rearSide=-facing, rearShoulder=w/2+rearSide*17;
 const rearHand=w/2+rearSide*(p.dead?24:25), rearHandY=32+(p.grounded?Math.abs(step)*.3:2);
 limb(rearShoulder,25,rearHand,rearHandY,7);hand(rearHand,rearHandY);
 const armShoulder=w/2+facing*17;
 const aimHandX=w/2+Math.cos(p.aim)*23, aimHandY=h*.46+Math.sin(p.aim)*22;
 limb(armShoulder,26,aimHandX,aimHandY,7);hand(aimHandX,aimHandY);
 // Bold flat square body; no blush, gradients, pupils, or cartoon decorations.
 ctx.fillStyle=skin;ctx.strokeStyle=outline;ctx.lineWidth=2.8;
 roundRect(4,3,w-8,43,8);ctx.fill();ctx.stroke();
 // A very minimal stick-person face, drawn as native canvas strokes and dots.
 ctx.strokeStyle=outline;ctx.fillStyle=outline;ctx.lineWidth=3.1;
 const dot=(px,py,r=2.3)=>{ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.fill()};
 const slash=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()};
 const mouth=(type)=>{ctx.beginPath();if(type==='open'){ctx.ellipse(24,33,3,4,0,0,TAU);ctx.stroke()}
    else if(type==='sad'){ctx.moveTo(19,34);ctx.quadraticCurveTo(24,29,29,34);ctx.stroke()}
    else if(type==='flat'){slash(20,33,28,33)}
    else{ctx.moveTo(19,31);ctx.quadraticCurveTo(24,36,29,31);ctx.stroke()}};
 if(p.dead){
   // Defeated expression: only two tiny X's and a short straight mouth.
   for(const a of [17,31]){slash(a-2,20,a+2,24);slash(a+2,20,a-2,24)}mouth('flat');
 }else if(p.faceHit>0){
   // Changed immediately by a bullet hit, remains visible for about half a second.
   slash(13,20,19,24);slash(19,20,13,24);
   slash(29,20,35,24);slash(35,20,29,24);mouth('open');
 }else if(p.shieldTime>0){
   slash(13,22,19,22);slash(29,22,35,22);mouth('flat');
 }else if(p.hp<p.stats.maxHp*.33){
   dot(16,22);dot(32,22);mouth('sad');
 }else if(p.faceShoot>0){
   dot(16,22);dot(32,22);mouth('open');
 }else if(p.id===0){
   // Neutral two-dot face without a wink; hurt / shoot / shield expressions still animate.
   dot(16,22);dot(32,22);mouth('smile');
 }else{
   // Blue rival has an equally simple, non-expressive default face.
   dot(16,22);dot(32,22);mouth('flat');
 }
 if(p.hitflash>0){ctx.strokeStyle='#fff7';ctx.lineWidth=2.4;roundRect(4,3,w-8,43,8);ctx.stroke()}
 ctx.restore();
 // Minimal weapon. Always sits in front of the matching-color aiming hand.
 if(!p.dead){ctx.save();ctx.translate(x+w/2,y+h*.46);ctx.rotate(p.aim);
 ctx.fillStyle='#152235';ctx.strokeStyle='#a9bfdc';ctx.lineWidth=1.5;roundRect(17,-4,22,8,3);ctx.fill();ctx.stroke();
 ctx.fillStyle='#e1ebfa';ctx.fillRect(31,-2.5,8,5);ctx.restore()}
 if(p.shieldTime>0){ctx.strokeStyle=p.color;ctx.lineWidth=5;ctx.globalAlpha=.55+.25*Math.sin(t*22);ctx.beginPath();ctx.arc(x+w/2,y+h/2,49,0,TAU);ctx.stroke();ctx.lineWidth=2;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(x+w/2,y+h/2,56,0,TAU);ctx.stroke()}
 ctx.globalAlpha=1;
 ctx.strokeStyle='#ffffff66';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+w/2,y-13,8,0,TAU);ctx.stroke();ctx.strokeStyle=p.color;ctx.beginPath();ctx.arc(x+w/2,y-13,8,-Math.PI/2,-Math.PI/2+TAU*(1-cap(p.shieldCD/p.stats.shield,0,1)));ctx.stroke();ctx.restore();
 
}
function drawBullets(){ctx.lineCap='round';for(const b of bullets){ctx.strokeStyle=b.col;ctx.globalAlpha=.3;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x-b.vx*.018,b.y-b.vy*.018);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill()}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=cap(p.life/.5,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*cap(p.life/.5,.1,1),0,TAU);ctx.fill()}ctx.globalAlpha=1;for(const t of texts){ctx.globalAlpha=cap(t.life,0,1);ctx.font='900 19px Impact, Arial Black, sans-serif';ctx.textAlign='center';ctx.strokeStyle='#111a2d';ctx.lineWidth=5;ctx.strokeText(t.msg,t.x,t.y);ctx.fillStyle=t.col;ctx.fillText(t.msg,t.x,t.y)}ctx.globalAlpha=1}
function render(){ctx.clearRect(0,0,W,H);ctx.save();if(shakeEnabled&&shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBackground();drawBullets();drawPlayer(p1);drawPlayer(p2);drawParticles();ctx.restore();
 if(state==='playing'&&mouse.used&&p1){ctx.save();ctx.strokeStyle='#ffd44aaa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,TAU);ctx.moveTo(mouse.x-15,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+15,mouse.y);ctx.moveTo(mouse.x,mouse.y-15);ctx.lineTo(mouse.x,mouse.y-5);ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+15);ctx.stroke();ctx.restore()}
 if(state==='roundover'&&winner!==null){ctx.fillStyle='#07101abb';ctx.fillRect(0,190,W,142);ctx.font='900 65px Impact, Arial Black, sans-serif';ctx.fillStyle=winner===0?'#ff595b':'#4594ff';ctx.textAlign='center';ctx.fillText((winner===0?'RED':'BLUE BOT')+' WINS ROUND!',W/2,275);ctx.fillStyle='#d1def0';ctx.font='800 17px monospace';ctx.fillText('UPGRADE DRAFT INCOMING',W/2,306)}
}
function frame(now){let dt=cap((now-last)/1000,0,.032);last=now;tick(dt);render();requestAnimationFrame(frame)}
function canvasMouse(e){let r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;mouse.used=true}
canvas.addEventListener('mousemove',canvasMouse);canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){canvasMouse(e);if(e.button===0)mouse.down=true;else if(e.button===2&&inPlay())block(p1)}else if(inPlay()){canvasMouse(e);mouse.down=true}});window.addEventListener('pointerup',()=>mouse.down=false);canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(['Space','KeyW','KeyA','KeyS','KeyD','KeyE','KeyF','Digit1','Digit2','Digit3'].includes(e.code))e.preventDefault();keys.add(e.code);if(state==='draft'&&['Digit1','Digit2','Digit3'].includes(e.code)){pickCard(window.currentOptions,Number(e.code.slice(-1))-1)}if(e.code==='Escape'){e.preventDefault();if(state==='playing')pause();else if(state==='paused')resume();else if(state==='settings'||state==='help'||state==='gameover')menu()}});
window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();mouse.down=false;Object.keys(touch).forEach(k=>touch[k]=false);if(state==='playing')pause()});
function pause(){state='paused';showOverlay(`<div class="result-panel"><div class="eyebrow"><span class="nib"></span> TIMEOUT / GAME PAUSED</div><div class="result-kicker">TAKE FIVE.</div><h2 class="roundheading">BACK <span>AT IT?</span></h2><p class="subtitle">Your fight is right where you left it. Press Escape to resume.</p><div class="buttonrow"><button class="btn" id="resumeBtn">RESUME FIGHT</button><button class="btn secondary" id="exitBtn">MAIN MENU</button></div></div>`);$('resumeBtn').onclick=resume;$('exitBtn').onclick=menu}
function resume(){state='playing';hideOverlay()}
for(const btn of document.querySelectorAll('[data-touch]')){const kind=btn.dataset.touch;const set=(v)=>{touch[kind]=v;btn.classList.toggle('pressed',v)};btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);set(true)});btn.addEventListener('pointerup',e=>{e.preventDefault();set(false)});btn.addEventListener('pointercancel',()=>set(false));btn.addEventListener('lostpointercapture',()=>set(false))}
$('soundBtn').onclick=()=>{muted=!muted;syncSound();savePrefs();if(!muted)sound(610,.08)};syncSound();$('menuBtn').onclick=()=>{if(state==='playing')pause();else menu()};
menu();requestAnimationFrame(frame);
})();
</script>
